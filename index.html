<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traductor">
<meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Traductor</title>
<style>
:root{--bg:#f0f4f9;--panel:#fff;--ink:#1f1f1f;--mute:#747775;--trans:#0b57d0;--chip:#d3e3fd;--chipink:#041e49;--fab:#c2e7ff;--fabink:#001d35;--pill:#fff;--rec:#d93025;
--a0:#fff1a8;--a1:#ffb800;--a2:#e84a00;--b0:#3f8cf0;--b1:#0a56d6;--b2:#07186b;--nl:#3d9bff;--nr:#ff9500;--gl:#3d9bff;--gr:#ff9500}
[data-theme="rn"]{--a0:#ff9a8a;--a1:#ff2d2d;--a2:#8a0010;--b0:#6b6b72;--b1:#28282c;--b2:#050506;--nl:#8e8e98;--nr:#ff3b30;--gl:#d0d0d8;--gr:#ff3b30}
[data-theme="vd"]{--a0:#fff3b0;--a1:#f5c400;--a2:#a86a00;--b0:#5fe3a0;--b1:#0e9f5a;--b2:#064a2a;--nl:#2ecc71;--nr:#f5b800;--gl:#2ecc71;--gr:#f5b800}
@media (prefers-color-scheme:dark){:root{--bg:#1c1d1f;--panel:#131314;--ink:#e3e3e3;--mute:#9aa0a6;--trans:#8ab4f8;--chip:#1c4a73;--chipink:#c2e7ff;--fab:#a8c7fa;--fabink:#062e6f;--pill:#131314;--rec:#f28b82}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 0 14px}
.logo{position:relative;z-index:5;width:62px;height:62px;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.logo svg{display:block;transition:filter .4s}
.logo.listen{--ringc:var(--gl)}.logo.work{--ringc:var(--gr)}
.logo.listen svg{filter:drop-shadow(0 0 9px var(--gl))}
.logo.work svg{filter:drop-shadow(0 0 9px var(--gr))}
.logo::before,.logo::after{content:"";position:absolute;left:50%;top:46%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid var(--ringc,transparent);opacity:0;z-index:-1}
.logo.listen::before,.logo.work::before{animation:ring 1.6s ease-out infinite}
.logo.listen::after,.logo.work::after{animation:ring 1.6s ease-out .8s infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.75}100%{transform:scale(2.2);opacity:0}}
#rot{transform-box:view-box;transform-origin:50px 46px}
#rot.spin{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#rot.spin{animation-duration:6s}.logo::before,.logo::after{animation:none!important}}
.nm{font-size:24px;font-weight:500;letter-spacing:.3px;line-height:1.1}
.nm b{font-weight:500;color:var(--nl)}.nm span{color:var(--nr)}
.sb{font-size:11px;letter-spacing:1.5px;color:var(--mute)}
#theme{position:absolute;right:16px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);padding:0;background:linear-gradient(135deg,var(--b1) 50%,var(--a1) 50%)}
.panel,.langs,.bar,#st,.brandtxt,#theme{transition:opacity .6s}
body.intro .panel,body.intro .langs,body.intro .bar,body.intro #st,body.intro .brandtxt,body.intro #theme{opacity:0}
body.intro .logo{transform:translateY(34vh) scale(3.4)}
.panel{flex:1;min-height:0;overflow:auto;background:var(--panel);border-radius:28px;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
#src{font-size:30px;line-height:1.25;word-break:break-word}
#dst{font-size:30px;line-height:1.25;color:var(--trans);word-break:break-word}
.dim{color:var(--mute)}
#f{display:none;gap:8px;margin-top:auto}
#f.show{display:flex}
#f input{flex:1;min-width:0;padding:12px 16px;border-radius:24px;border:1px solid var(--mute);background:transparent;color:var(--ink);font-size:17px;outline:none}
#f button{border:0;border-radius:24px;background:var(--chip);color:var(--chipink);padding:0 18px;font-size:16px}
#st{text-align:center;font-size:14px;color:var(--mute);min-height:38px;padding:8px 20px 0}
.langs{display:flex;align-items:center;gap:10px;padding:0 16px}
.lang{flex:1;text-align:center;background:var(--pill);border-radius:22px;padding:16px 8px;font-size:18px}
#swap{border:0;background:none;color:var(--ink);width:44px;height:44px;padding:0}
.bar{display:flex;align-items:flex-end;gap:14px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0))}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink);flex:1;min-width:0}
.act button{width:62px;height:62px;border-radius:50%;border:0;background:var(--chip);color:var(--chipink);display:flex;align-items:center;justify-content:center;padding:0}
.act button.on{background:var(--fab);color:var(--fabink)}
.act svg,#swap svg{width:26px;height:26px;fill:currentColor}
#mic{width:86px;height:86px;border-radius:28px;border:0;background:var(--fab);color:var(--fabink);display:flex;align-items:center;justify-content:center;flex:none}
#mic svg{width:38px;height:38px;fill:currentColor}
#mic.on{background:var(--rec);color:#fff;animation:p 1.3s infinite}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(217,48,37,.2)}}
</style>
</head>
<body class="intro">
<script>setTimeout(function(){document.body.classList.remove("intro")},4000)</script>
<header>
<div class="logo" id="logo">
<svg width="62" height="62" viewBox="0 0 100 100" role="img" aria-label="Yin Yang">
<defs>
<radialGradient id="yA" gradientUnits="userSpaceOnUse" cx="34" cy="26" r="74"><stop offset="0" style="stop-color:var(--a0)"/><stop offset="0.35" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></radialGradient>
<radialGradient id="yB" gradientUnits="userSpaceOnUse" cx="66" cy="66" r="74"><stop offset="0" style="stop-color:var(--b0)"/><stop offset="0.45" style="stop-color:var(--b1)"/><stop offset="1" style="stop-color:var(--b2)"/></radialGradient>
<radialGradient id="ed" gradientUnits="userSpaceOnUse" cx="50" cy="46" r="44"><stop offset="0.72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.4"/></radialGradient>
<radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="50" cy="94" rx="30" ry="3.5" fill="#000" opacity="0.4"/>
<g id="rot">
<circle cx="50" cy="46" r="44" fill="url(#yA)"/>
<path d="M50 2 A44 44 0 0 1 50 90 A22 22 0 0 1 50 46 A22 22 0 0 0 50 2 Z" fill="url(#yB)"/>
<circle cx="50" cy="24" r="6.5" fill="url(#yB)"/>
<circle cx="50" cy="68" r="6.5" fill="url(#yA)"/>
</g>
<circle cx="50" cy="46" r="44" fill="url(#ed)"/>
<ellipse cx="34" cy="21" rx="20" ry="11" transform="rotate(-32 34 21)" fill="url(#gl)"/>
<circle cx="50" cy="46" r="43.2" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.6"/>
</svg>
</div>
<div class="brandtxt"><div class="nm"><b>Xcry</b><span>PR</span></div><div class="sb">TRADUCTOR</div></div>
<button id="theme" aria-label="Cambiar colores"></button>
</header>

<div class="panel">
  <div id="src" class="dim">Toca el micrófono y habla…</div>
  <div id="dst"></div>
  <form id="f"><input id="txt" placeholder="Escribe en español…" autocomplete="off"><button type="submit">Traducir</button></form>
</div>

<div id="st"></div>

<div class="langs">
  <div class="lang" id="l1">Español</div>
  <button id="swap" aria-label="Cambiar idiomas"><svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></button>
  <div class="lang" id="l2">Inglés</div>
</div>

<div class="bar">
  <div class="act"><button id="cont" class="on" aria-label="Modo continuo"><svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8A5.87 5.87 0 0 1 6 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg></button>Continuo</div>
  <div class="act"><button id="rep" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>Repetir</div>
  <div class="act"><button id="kb" aria-label="Escribir"><svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg></button>Escribir</div>
  <button id="mic" aria-label="Hablar"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
</div>

<script>
(function(){
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var $=function(i){return document.getElementById(i)};
var srcEl=$("src"),dstEl=$("dst"),stEl=$("st"),mic=$("mic"),contBtn=$("cont"),rot=$("rot"),logo=$("logo");
var MIC='<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>';
var STOP='<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>';
var esToEn=true,listening=false,busy=false,rec=null,last="",finalText="",heard=false,hintT=null,contOn=true,typeT=null;
var reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
var introOn=!reduce;

function spin(){
  rot.classList.toggle("spin",listening||busy||introOn);
  logo.classList.toggle("listen",listening&&!busy);
  logo.classList.toggle("work",busy);
}
function status(t){stEl.textContent=t||"";spin()}
function ui(){
  $("l1").textContent=esToEn?"Español":"Inglés";
  $("l2").textContent=esToEn?"Inglés":"Español";
  $("txt").placeholder=esToEn?"Escribe en español…":"Escribe en inglés…";
  mic.classList.toggle("on",listening);mic.innerHTML=listening?STOP:MIC;
  contBtn.classList.toggle("on",contOn);spin();
}
function unescapeHtml(s){var t=document.createElement("textarea");t.innerHTML=s;return t.value}

function setDst(t){clearInterval(typeT);dstEl.textContent=t}
function typeText(text){
  clearInterval(typeT);dstEl.textContent="";
  if(reduce){dstEl.textContent=text;return}
  var i=0,d=Math.max(12,Math.min(40,Math.floor(2200/Math.max(1,text.length))));
  typeT=setInterval(function(){i++;dstEl.textContent=text.slice(0,i);if(i>=text.length)clearInterval(typeT)},d);
}

function prime(){try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
var MALE=["aaron","evan","nathan","tom","reed","eddy","alex","daniel","arthur","gordon","oliver","rishi","matthew","lee","jorge","juan","diego","carlos","enrique","pablo","andr\u00e9s","rocko"];
function maleVoice(lang){
  var all=[];try{all=speechSynthesis.getVoices()||[]}catch(e){}
  var base=lang.slice(0,2);
  var cand=all.filter(function(x){
    var l=x.lang.replace("_","-");if(l.slice(0,2)!==base)return false;
    var n=x.name.toLowerCase();
    return MALE.some(function(m){return n===m||n.indexOf(m+" ")===0||n.indexOf(m+" (")===0});
  });
  cand.sort(function(a,b){
    function sc(x){var n=x.name.toLowerCase(),l=x.lang.replace("_","-");return (l===lang?4:0)+(/premium|enhanced|siri/.test(n)?2:0)+(x.localService?1:0)}
    return sc(b)-sc(a);
  });
  return cand[0]||null;
}
function speak(text,done){
  if(!("speechSynthesis" in window)){done&&done();return}
  speechSynthesis.cancel();
  var lang=esToEn?"en-US":"es-ES";
  var u=new SpeechSynthesisUtterance(text);u.lang=lang;
  var v=maleVoice(lang);
  if(v){u.voice=v;u.lang=v.lang;u.pitch=1}else{u.pitch=0.7}
  u.rate=0.95;
  u.onend=u.onerror=function(){done&&done()};
  speechSynthesis.speak(u);
}

async function translate(text){
  text=(text||"").trim();if(!text)return;
  busy=true;srcEl.textContent=text;srcEl.classList.remove("dim");
  setDst("…");status("Traduciendo…");
  try{
    var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+(esToEn?"es|en":"en|es");
    var r=await fetch(url);var j=await r.json();
    if(String(j.responseStatus)!=="200")throw new Error("quota");
    var out=unescapeHtml(j.responseData.translatedText||"").trim();
    if(!out)throw new Error("empty");
    typeText(out);last=out;status("Hablando…");
    speak(out,function(){busy=false;status("");resume()});
  }catch(e){
    busy=false;setDst("No se pudo traducir. Revisa tu internet o intenta más tarde.");status("");
  }
}

function start(){
  if(!SR){listening=false;ui();status("Este navegador no tiene dictado. Abre la página en Safari o usa Escribir.");return}
  rec=new SR();rec.lang=esToEn?"es-ES":"en-US";rec.interimResults=true;rec.continuous=false;
  finalText="";heard=false;clearTimeout(hintT);
  rec.onstart=function(){status("Escuchando…")};
  rec.onspeechstart=function(){heard=true;status("Te escucho…")};
  rec.onresult=function(e){
    heard=true;var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal)finalText+=t;else interim+=t;
    }
    srcEl.textContent=(finalText+interim)||"…";srcEl.classList.remove("dim");
  };
  rec.onerror=function(e){
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      listening=false;ui();
      status("Micrófono bloqueado. Permítelo en aA → Configuración del sitio web, y activa Dictado en Ajustes → General → Teclado.");
    }else if(e.error==="no-speech"){status("No te escuché. Habla más cerca del micrófono.")}
    else if(e.error!=="aborted"){status("Error de micrófono: "+e.error)}
  };
  rec.onend=function(){
    clearTimeout(hintT);
    if(finalText.trim()){translate(finalText)}
    else if(listening&&!busy){setTimeout(function(){if(listening&&!busy)start()},500)}
    else if(!busy){listening=false;ui()}
  };
  try{rec.start()}catch(e){status("No se pudo iniciar el micrófono.")}
  hintT=setTimeout(function(){if(listening&&!heard)status("No te escucho. Revisa: Ajustes → General → Teclado → Activar dictado, y agrega el teclado en español.")},7000);
}
function resume(){
  if(listening&&contOn&&!busy){start()}
  else{listening=false;ui()}
}

mic.addEventListener("click",function(){
  prime();
  if(listening){listening=false;ui();clearTimeout(hintT);try{rec&&rec.stop()}catch(e){}speechSynthesis.cancel();busy=false;status("");return}
  if(busy)return;
  listening=true;ui();start();
});
$("swap").addEventListener("click",function(){
  listening=false;busy=false;clearTimeout(hintT);try{rec&&rec.abort()}catch(e){}speechSynthesis.cancel();
  esToEn=!esToEn;srcEl.textContent="Toca el micrófono y habla…";srcEl.classList.add("dim");setDst("");status("");ui();
});
contBtn.addEventListener("click",function(){contOn=!contOn;ui()});
$("rep").addEventListener("click",function(){if(last){prime();speak(last)}});
$("kb").addEventListener("click",function(){var f=$("f");f.classList.toggle("show");if(f.classList.contains("show"))$("txt").focus()});
$("f").addEventListener("submit",function(ev){
  ev.preventDefault();prime();var v=$("txt").value;$("txt").value="";translate(v);
});

var THEMES=["","rn","vd"],ti=0;
try{var saved=localStorage.getItem("tema");if(saved!==null){ti=Math.max(0,THEMES.indexOf(saved))}}catch(e){}
function applyTheme(){
  if(THEMES[ti])document.documentElement.setAttribute("data-theme",THEMES[ti]);
  else document.documentElement.removeAttribute("data-theme");
}
$("theme").addEventListener("click",function(){
  ti=(ti+1)%THEMES.length;applyTheme();
  try{localStorage.setItem("tema",THEMES[ti])}catch(e){}
});
applyTheme();

ui();
if(introOn){setTimeout(function(){introOn=false;document.body.classList.remove("intro");spin()},2000)}
else{document.body.classList.remove("intro")}
})();
</script>
</body>
</html>
